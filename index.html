<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cornerstone Bible Audio</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="512.png">

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAV07bab01c879c608f54086287953032",
      authDomain: "bible-audio-205e4.firebaseapp.com",
      projectId: "bible-audio-205e4",
      storageBucket: "bible-audio-205e4.appspot.com",
      messagingSenderId: "87953029111",
      appId: "1:87953029111:web:07bab01c879c608f540862"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.FirestoreMethods = { doc, getDoc, setDoc, updateDoc, increment };
    
    window.initFirebaseDone = true;
    if (typeof window.checkFirebaseAndUser === "function") {
      window.checkFirebaseAndUser();
    }
  </script>

  <style>
    body {
      background-color: #111b14;
      color: #f4d7cf;
      font-family: Georgia, serif;
      padding: 10px;
      margin: 0;
      padding-bottom: 160px;
    }
    .header-sub { color: #f5a94d; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
    h1 { color: #f5a94d; font-size: 22px; margin-top: 5px; }
    .card-box { background-color: #221b14; border: 1px solid #332025; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .category-title { color: #f9c077; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .book-card {
      padding: 14px;
      border-radius: 6px;
      background-color: #1a140f;
      margin-bottom: 8px;
      border: 1px solid #3a281e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .locked { opacity: 0.5; filter: grayscale(50%); cursor: not-allowed; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #f5a94d;
      background: #111b14;
      color: #f4d7cf;
      font-family: Georgia, serif;
      box-sizing: border-box;
    }
    button {
      background-color: #f5a94d;
      color: #111b14;
      font-weight: bold;
      cursor: pointer;
    }
    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a140f;
      border-top: 1px solid #f5a94d;
      padding: 12px;
    }
  </style>
</head>
<body>

  <div class="header-sub">Cornerstone Audio Player</div>
  <h1 id="user-balance">Balans pa w: 0 Gdes</h1>

  <div class="card-box" id="admin-panel">
    <div class="category-title">🔒 Mod Pwopriyetè / Kontwòl</div>
    <div id="my-ref-code" style="font-weight: bold; color: #f5a94d; margin-bottom: 8px;">Kòd: ...</div>
    <button onclick="copierLien()">Jwenn Kòd Paran mwen pou m pataje</button>
  </div>

  <div class="category-title">Liv Istorik Yo (12 Liv)</div>
  <div id="books-container"></div>

  <div class="player-bar">
    <div style="font-size: 11px; color: #f5a94d; text-transform: uppercase;">M ap koute kounye a:</div>
    <div id="current-playing-title" style="font-weight: bold; margin-bottom: 6px;">Chwazi yon liv</div>
    <audio id="audio-element" controls style="width: 100%;"></audio>
  </div>

  <script>
    const BOOKS = [
      { title: "JOZYÉ", audioUrl: "audio/jozye.mp3" },
      { title: "JIJ", audioUrl: "audio/jij.mp3" },
      { title: "RIT", audioUrl: "audio/rit.mp3" },
      { title: "1 SAMYÈL", audioUrl: "audio/1samyel.mp3" },
      { title: "2 SAMYÈL", audioUrl: "audio/2samyel.mp3" },
      { title: "1 WA", audioUrl: "audio/1wa.mp3" },
      { title: "2 WA", audioUrl: "audio/2wa.mp3" },
      { title: "1 KRAWNIK", audioUrl: "audio/1krawnik.mp3" },
      { title: "2 KRAWNIK", audioUrl: "audio/2krawnik.mp3" },
      { title: "EZTRA", audioUrl: "audio/eztra.mp3" },
      { title: "NECHEMI", audioUrl: "audio/nechemi.mp3" },
      { title: "ESTÈ", audioUrl: "audio/este.mp3" }
    ];

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    let userCode = getQueryParam("ref") || "CORNERSTONE-OWNER";
    let isUnlocked = (userCode === "CORNERSTONE-OWNER");

    document.getElementById("my-ref-code").innerText = "Kòd Parèy ou a: " + userCode;

    function renderBooks() {
      const container = document.getElementById("books-container");
      container.innerHTML = "";
      BOOKS.forEach((bookObj, index) => {
        const div = document.createElement("div");
        const canPlay = (index < 2 || isUnlocked);
        div.className = "book-card " + (canPlay ? "" : "locked");
        div.innerHTML = `
          <span>${bookObj.title}</span>
          <span>${canPlay ? "🔊" : "🔒"}</span>
        `;
        if (canPlay) {
          div.onclick = () => playBook(bookObj.title, bookObj.audioUrl);
        }
        container.appendChild(div);
      });
    }

    function playBook(title, audioUrl) {
      document.getElementById("current-playing-title").innerText = title;
      const audio = document.getElementById("audio-element");
      audio.src = audioUrl;
      audio.play().catch(e => console.log("Jè odyo mande aksyon:", e));
    }

    function copierLien() {
      const shareUrl = window.location.origin + window.location.pathname + "?ref=" + userCode;
      navigator.clipboard.writeText(shareUrl);
      alert("Lyèn pataje w la kopye nan memwa telefòn nan!");
    }

    window.checkFirebaseAndUser = async function() {
      renderBooks(); // Asire liv yo parèt dirèk

      if (!window.db) return;
      try {
        const { doc, getDoc } = window.FirestoreMethods;
        const userDocRef = doc(window.db, "users", userCode);
        const userSnap = await getDoc(userDocRef);

        let balance = 0;
        if (userSnap.exists()) {
          const data = userSnap.data();
          balance = data.balance || 0;
          if (data.unlocked) {
            isUnlocked = true;
          }
        } else if (userCode === "CORNERSTONE-OWNER") {
          isUnlocked = true;
        }

        document.getElementById("user-balance").innerText = "Balans pa w: " + balance + " Gdes";
        renderBooks();
      } catch (e) {
        console.log("Erè koneksyon Firebase:", e);
      }
    };

    // Afiche liv yo menm anvan Firebase reponn pou evite ekran vid
    renderBooks();
    if (window.initFirebaseDone) {
      window.checkFirebaseAndUser();
    } else {
      setTimeout(() => {
        if (typeof window.checkFirebaseAndUser === "function") {
          window.checkFirebaseAndUser();
        }
      }, 1000);
    }
  </script>
</body>
</html>
