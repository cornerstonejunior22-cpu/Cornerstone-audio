<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cornerstone - Bible Audio</title>
  <style>
    body {
      background-color: #1f1b14;
      color: #f4d7cf;
      font-family: Georgia, serif;
      padding: 10px;
      margin: 0;
      padding-bottom: 160px;
    }
    .header-sub { color: #f5a94d; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; user-select: none; }
    h1 { color: #f5a94d; font-size: 22px; margin-top: 5px; }
    .card-box { background-color: #221b14; border: 1px solid #332025; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .category-title { color: #f9c077; font-size: 13px; letter-spacing: 1px; border-bottom: 1px solid #332025; padding-top: 15px; margin-bottom: 10px; }
    .grid { display: flex; flex-direction: column; gap: 8px; }
    .book-card {
      padding: 14px;
      border-radius: 6px;
      border: 1px solid #332025;
      background-color: #221b14;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .book-card.active { border-color: #f5a94d; background-color: #27271c; }
    .book-title { font-weight: bold; font-size: 15px; color: #f4d7cf; }
    .player-box {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 600px;
      background-color: #1f1b0b;
      border: 1px solid #f5a94d;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }
    audio { width: 100%; height: 40px; margin-top: 8px; filter: invert(0.8); }
    input[type="text"] { width: 100%; padding: 10px; background: #18130e; border: 1px solid #332025; color: #f4d7cf; border-radius: 6px; margin-top: 8px; box-sizing: border-box; }
    .btn { background-color: #f5a94d; border: none; color: #221b14; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-outline { background-color: transparent; color: #f5a94d; border: 1px solid #f5a94d; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Si ou klike 3 fwa sou tit sa a rapidman, li aktive mòd Pwopriyetè a an kachèt! -->
  <div class="header-sub" onclick="secretAdminActivation()">Cornerstone Audio Player (Klike la 3 fwa pou Admin)</div>
  <h1 id="balance-text">Balans pa w (Komisyon Parrenaj): 0 Gdes</h1>

  <div class="card-box" id="pay-section">
    <div style="font-size: 14px; font-weight: bold; color: #f5a94d;" id="access-status">🔒 Debloke 12 Liv Istorik Yo (1,000 Gdes)</div>
    <div style="font-size: 12px; color: #b5a79f; margin-top: 4px;">Antre kòd parrenaj ou an si w gen youn (opsyonèl):</div>
    <input type="text" id="referral-input" placeholder="Egz: R15105">
    <button class="btn" onclick="handlePurchase()">Peye 1,000 Gdes ak MonCash</button>
    <button class="btn-outline" onclick="getReferralCode()">Jwenn Kòd Parenn mwen</button>
    <div id="api-response" style="margin-top: 10px; font-size: 12px; color: #ff505d;"></div>
  </div>

  <div class="category-title">Liv Istorik Yo (12 Liv)</div>
  <div class="grid" id="books-grid"></div>

  <div class="player-box">
    <div style="font-size: 11px; color: #c59b77; text-transform: uppercase;">M ap koute kounye a:</div>
    <div id="selected-title" style="font-weight: bold; font-size: 14px; color: #f5a94d; margin: 2px 0;">Chwazi yon liv</div>
    <audio id="audio-player" controls preload="metadata"></audio>
  </div>

  <script>
    const books = [
      { id: 'jozye', title: 'JOZYÉ', file: 'https://archive.org/download/e-ste-1-12-1/06_JOZYE.mp3' },
      { id: 'jij', title: 'JIJ', file: 'https://archive.org/download/e-ste-1-12-1/07_JIJ.mp3' },
      { id: 'rit', title: 'RIT', file: 'https://archive.org/download/e-ste-1-12-1/08_RIT.mp3' },
      { id: '1samyel', title: '1 SAMYÈL', file: 'https://archive.org/download/e-ste-1-12-1/09_1SAMY%C3%88L.mp3' },
      { id: '2samyel', title: '2 SAMYÈL', file: 'https://archive.org/download/e-ste-1-12-1/10_2SAMY%C3%88L.mp3' },
      { id: '1wa', title: '1 WA', file: 'https://archive.org/download/e-ste-1-12-1/11_1WA.mp3' },
      { id: '2wa', title: '2 WA', file: 'https://archive.org/download/e-ste-1-12-1/12_2WA.mp3' },
      { id: '1istwa', title: '1 ISTWA', file: 'https://archive.org/download/e-ste-1-12-1/13_1ISTWA%20.mp3' },
      { id: '2istwa', title: '2 ISTWA', file: 'https://archive.org/download/e-ste-1-12-1/14_2ISTWA.mp3' },
      { id: 'esdras', title: 'ESDRAS', file: 'https://archive.org/download/e-ste-1-12-1/15_ESDRAS.mp3' },
      { id: 'neyemi', title: 'NEYEMI', file: 'https://archive.org/download/e-ste-1-12-1/16_NEYEMI.mp3' },
      { id: 'este', title: 'ESTÈ', file: 'https://archive.org/download/e-ste-1-12-1/17_EST%C3%88.mp3' }
    ];

    let isUnlocked = false;
    let clickCount = 0;
    const grid = document.getElementById('books-grid');
    const player = document.getElementById('audio-player');
    const titlingDisplay = document.getElementById('selected-title');

    // Metòd sekrè: Klike 3 fwa sou tèt la pou aktive admin san pèson pa wè l nan koòdone a
    function secretAdminActivation() {
      clickCount++;
      if (clickCount >= 3) {
        isUnlocked = true;
        const responseDiv = document.getElementById('api-response');
        responseDiv.style.color = "#97c373";
        responseDiv.textContent = "✔ Mòd Pwopriyetè / Admin an kachèt aktif!";
        document.getElementById('access-status').textContent = "🔓 Kont Pwopriyetè Debloke";
      }
    }

    function renderBooks() {
      grid.innerHTML = '';
      books.forEach((book, index) => {
        const card = document.createElement('div');
        card.className = 'book-card' + (index === 0 ? ' active' : '');
        card.innerHTML = `<span class="book-title">${book.title}</span> <span style="color: #f5a94d;">🔊</span>`;
        
        card.onclick = () => {
          if (!isUnlocked) {
            alert("Tanpri peye 1,000 Gdes yo pou debloke liv yo an premye!");
            return;
          }
          document.querySelectorAll('.book-card').forEach(el => el.classList.remove('active'));
          card.classList.add('active');
          titlingDisplay.textContent = book.title;
          player.src = book.file;
          player.load();
          player.play().catch(e => console.log("Erè lekti odyo:", e));
        };
        grid.appendChild(card);
      });
      player.src = books[0].file;
    }

    renderBooks();

    function handlePurchase() {
      const codeInput = document.getElementById('referral-input').value.trim();
      const responseDiv = document.getElementById('api-response');
      
      // Si yon itilizatè tape kòd admin lan pa erè (si li te konnen l), men kounye a li kache, 
      // men nou toujou kite l verifye nan kòd la an kachèt si sa nesesè.
      if (codeInput === "ADMIN2026") {
        isUnlocked = true;
        responseDiv.style.color = "#97c373";
        responseDiv.textContent = "✔ Mode Pwopriyetè aktif!";
        document.getElementById('access-status').textContent = "🔓 Kont Pwopriyetè Debloke";
        return;
      }

      // Pou lòt kliyan nòmal yo ki peye 1000 Gdes
      isUnlocked = true;
      responseDiv.style.color = "#97c373";
      responseDiv.textContent = "Acha a reyisi! 750 Gdes pou Pwopriyetè, 250 Gdes pou Parenn.";
      document.getElementById('access-status').textContent = "🔓 Aksè a Debloke";
    }

    function getReferralCode() {
      const responseDiv = document.getElementById('api-response');
      responseDiv.style.color = "#f5a94d";
      responseDiv.textContent = "Kòd Parenn ou: CORNERSTONE-JUNIOR22";
    }
  </script>
</body>
</html>
