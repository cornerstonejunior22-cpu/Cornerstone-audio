<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornerstone - Bible Audio</title>
    <style>
        body {
            background-color: #1a1612;
            color: #e4d7cf;
            font-family: Georgia, serif;
            padding: 20px;
            margin: 0;
            padding-bottom: 160px;
        }
        .header-sub { color: #c59b77; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
        h1 { color: #f5a94d; font-size: 24px; margin-top: 5px; }
        h1 span { color: #c59b77; font-style: italic; }
        .category-title { color: #c59b77; font-size: 13px; letter-spacing: 1px; border-top: 1px solid #332a25; padding-top: 15px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
        .book-card {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #332a25;
            background-color: #221b14;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .book-card.active { border-color: #f5a94d; background-color: #2f271e; }
        .book-num { font-size: 11px; color: #7c5273; margin-right: 8px; }
        .book-title { font-weight: bold; font-size: 14px; color: #ff50d3; }
        .player-box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 600px;
            background-color: #f120c0b;
            border: 1px solid #f50b27;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        audio { width: 100%; height: 48px; margin-top: 8px; filter: invert(0.8); }
    </style>
</head>
<body>

    <div class="header-sub">CORNERSTONE - BIBLE AUDIO</div>
    <h1><span>Pawol</span> yo.</h1>

    <div class="category-title">OLD TESTAMENT</div>
    <div class="grid" id="books-grid"></div>

    <div class="player-box">
        <div style="font-size: 12px; color: #c59b77; text-transform: uppercase;">M ap koute kounye a:</div>
        <div id="selected-title" style="font-weight: bold; font-size: 14px; color: #f5a94d; margin: 4px 0;">Chwazi yon liv</div>
        <audio id="audio-player" controls preload="metadata"></audio>
    </div>

    <script>
        // Lyen API Vercel ou a
        const API_URL = "https://cornerstone-audio-app-api-server-v6.vercel.app";

        const books = [
            { id: 'jenèz', title: 'Jenèz', number: '01', file: 'audio/jenew.mp3' },
            { id: 'ekzòd', title: 'Ekzòd', number: '02', file: 'audio/ekzod.mp3' },
            { id: 'levitik', title: 'Levitik', number: '03', file: 'audio/levit.mp3' },
            { id: 'nonb', title: 'Nonb', number: '04', file: 'audio/nonb.mp3' },
            { id: 'detewonomi', title: 'Detewonomi', number: '05', file: 'audio/detew.mp3' },
            { id: 'jozye', title: 'Jozye', number: '06', file: 'audio/jozye.mp3' },
            { id: ' jij ', title: 'Jij', number: '07', file: 'audio/jij.mp3' },
            { id: 'rit', title: ' Rit ', number: '08', file: 'audio/rit.mp3' },
            { id: 'samiyèl1', title: '1 Samiyèl', number: '09', file: 'audio/samiyel.mp3' },
            { id: 'samiyèl2', title: '2 Samiyèl', number: '10', file: 'audio/samiyel2.mp3' },
            { id: 'wa1', title: '1 Wa', number: '11', file: 'audio/wa1.mp3' },
            { id: 'wa2', title: '2 Wa', number: '12', file: 'audio/wa2.mp3' }
        ];

        const grid = document.getElementById('books-grid');
        const player = document.getElementById('audio-player');
        const titlingDisplay = document.getElementById('selected-title');

        function selectBook(book, element) {
            document.querySelectorAll('.book-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            titlingDisplay.textContent = book.title;
            player.src = book.file;
            player.play();
        }

        books.forEach((book, index) => {
            const card = document.createElement('div');
            card.className = 'book-card' + (index === 0 ? ' active' : '');
            card.innerHTML = `<span class="book-num">${book.number}</span><span class="book-title">${book.title}</span>`;
            card.onclick = () => selectBook(book, card);
            grid.appendChild(card);
        });

        player.src = books[0].file;
    </script>
</body>
</html>
