<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cornerstone - Bible Audio</title>
  <style>
    body {
      background-color: #1f1b14;
      color: #f4d7cf;
      font-family: Georgia, serif;
      padding: 10px;
      margin: 0;
      padding-bottom: 160px;
    }
    .header-sub { color: #f5a94d; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; user-select: none; }
    h1 { color: #f5a94d; font-size: 22px; margin-top: 5px; }
    .card-box { background-color: #221b14; border: 1px solid #332025; padding: 15px; border-radius: 8px; margin-top: 15px; }
    .category-title { color: #f9c077; font-size: 13px; letter-spacing: 1px; border-bottom: 1px solid #332025; padding-top: 15px; margin-bottom: 10px; }
    .grid { display: flex; flex-direction: column; gap: 8px; }
    .book-card {
      padding: 14px;
      border-radius: 6px;
      border: 1px solid #332025;
      background-color: #221b14;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .book-card.active { border-color: #f5a94d; background-color: #27271c; }
    .book-title { font-weight: bold; font-size: 15px; color: #f4d7cf; }
    .player-box {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 600px;
      background-color: #1f1b0b;
      border: 1px solid #f5a94d;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }
    audio { width: 100%; height: 40px; margin-top: 8px; filter: invert(0.8); }
    input[type="text"] { width: 100%; padding: 10px; background: #18130e; border: 1px solid #332025; color: #f4d7cf; border-radius: 6px; margin-top: 8px; box-sizing: border-box; }
    .btn { background-color: #f5a94d; border: none; color: #221b14; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-outline { background-color: transparent; color: #f5a94d; border: 1px solid #f5a94d; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header-sub">Cornerstone Audio Player</div>
  <h1 id="balance-text">Balans pa w (Komisyon Parrenaj): 0 Gdes</h1>

  <div class="card-box" id="pay-section">
    <div style="font-size: 14px; font-weight: bold; color: #f5a94d;" id="access-status">🔒 Aksè Fèmen: Ou bezwen yon Kòd Parrenaj pou antre</div>
    <div style="font-size: 12px; color: #ff505d; margin-top: 4px;" id="warning-msg">Pa gen kòd nan lyen an! Mande yon zanmi oswa Pwopriyetè a lyen li pou w ka antre.</div>
    
    <input type="text" id="referral-input" placeholder="Kòd Parrenaj la ap parèt la a..." readonly style="opacity: 0.7;">
    
    <button class="btn" id="pay-btn" onclick="handlePurchase()" disabled style="opacity: 0.5; cursor: not-allowed;">Peye 1,000 Gdes ak MonCash</button>
    <button class="btn-outline" onclick="getReferralCode()">Jwenn Kòd Parenn mwen pou m pataje</button>
    <div id="api-response" style="margin-top: 10px; font-size: 12px; color: #ff505d;"></div>
  </div>

  <div class="category-title">Liv Istorik Yo (12 Liv)</div>
  <div class="grid" id="books-grid"></div>

  <div class="player-box">
    <div style="font-size: 11px; color: #c59b77; text-transform: uppercase;">M ap koute kounye a:</div>
    <div id="selected-title" style="font-weight: bold; font-size: 14px; color: #f5a94d; margin: 2px 0;">Chwazi yon liv</div>
    <audio id="audio-player" controls preload="metadata"></audio>
  </div>

  <script>
    const books = [
      { id: 'jozye', title: 'JOZYÉ', file: 'https://archive.org/download/e-ste-1-12-1/06_JOZYE.mp3' },
      { id: 'jij', title: 'JIJ', file: 'https://archive.org/download/e-ste-1-12-1/07_JIJ.mp3' },
      { id: 'rit', title: 'RIT', file: 'https://archive.org/download/e-ste-1-12-1/08_RIT.mp3' },
      { id: '1samyel', title: '1 SAMYÈL', file: 'https://archive.org/download/e-ste-1-12-1/09_1SAMY%C3%88L.mp3' },
      { id: '2samyel', title: '2 SAMYÈL', file: 'https://archive.org/download/e-ste-1-12-1/10_2SAMY%C3%88L.mp3' },
      { id: '1wa', title: '1 WA', file: 'https://archive.org/download/e-ste-1-12-1/11_1WA.mp3' },
      { id: '2wa', title: '2 WA', file: 'https://archive.org/download/e-ste-1-12-1/12_2WA.mp3' },
      { id: '1istwa', title: '1 ISTWA', file: 'https://archive.org/download/e-ste-1-12-1/13_1ISTWA%20.mp3' },
      { id: '2istwa', title: '2 ISTWA', file: 'https://archive.org/download/e-ste-1-12-1/14_2ISTWA.mp3' },
      { id: 'esdras', title: 'ESDRAS', file: 'https://archive.org/download/e-ste-1-12-1/15_ESDRAS.mp3' },
      { id: 'neyemi', title: 'NEYEMI', file: 'https://archive.org/download/e-ste-1-12-1/16_NEYEMI.mp3' },
      { id: 'este', title: 'ESTÈ', file: 'https://archive.org/download/e-ste-1-12-1/17_EST%C3%88.mp3' }
    ];

    let isUnlocked = false;
    const grid = document.getElementById('books-grid');
    const player = document.getElementById('audio-player');
    const titlingDisplay = document.getElementById('selected-title');

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);

      // Tcheke si se ou menm ki mete adrès admin lan sou telefòn ou pou premye fwa
      if (urlParams.get('admin') === 'cornerstone2026') {
        activateOwnerMode();
        return;
      }

      // Tcheke si telefòn sa a te deja anrejistre kòm Pwopriyetè anvan
      if (localStorage.getItem('cornerstone_owner') === 'true') {
        activateOwnerMode();
        return;
      }

      // Si se yon kliyan nòmal, tcheke si li gen kòd parrenaj nan lyen li
      const refCode = urlParams.get('ref');
      const inputField = document.getElementById('referral-input');
      const payBtn = document.getElementById('pay-btn');
      const warningMsg = document.getElementById('warning-msg');
      const accessStatus = document.getElementById('access-status');

      if (refCode && refCode.trim() !== "") {
        inputField.value = refCode;
        warningMsg.style.display = "none";
        accessStatus.textContent = "🔒 Debloke 12 Liv Istorik Yo (1,000 Gdes)";
        payBtn.disabled = false;
        payBtn.style.opacity = "1";
        payBtn.style.cursor = "pointer";
      }
    };

    function activateOwnerMode() {
      isUnlocked = true;
      localStorage.setItem('cornerstone_owner', 'true');
      document.getElementById('access-status').textContent = "🔓 Mòd Pwopriyetè / Admin Aktif";
      document.getElementById('warning-msg').style.display = "none";
      const payBtn = document.getElementById('pay-btn');
      payBtn.disabled = false;
      payBtn.style.opacity = "1";
      payBtn.style.cursor = "pointer";
      document.getElementById('referral-input').value = "CORNERSTONE-OWNER";
      const responseDiv = document.getElementById('api-response');
      responseDiv.style.color = "#97c373";
      responseDiv.textContent = "✔ Ou konekte kòm Pwopriyetè sou aparèy sa a. Tout liv yo debloke!";
    }

    function renderBooks() {
      grid.innerHTML = '';
      books.forEach((book, index) => {
        const card = document.createElement('div');
        card.className = 'book-card' + (index === 0 ? ' active' : '');
        card.innerHTML = `<span class="book-title">${book.title}</span> <span style="color: #f5a94d;">🔊</span>`;
        
        card.onclick = () => {
          if (!isUnlocked) {
            alert("Tanpri antre nan chèn nan ak yon kòd parrenaj an premye!");
            return;
          }
          document.querySelectorAll('.book-card').forEach(el => el.classList.remove('active'));
          card.classList.add('active');
          titlingDisplay.textContent = book.title;
          player.src = book.file;
          player.load();
          player.play().catch(e => console.log("Erè lekti odyo:", e));
        };
        grid.appendChild(card);
      });
      player.src = books[0].file;
    }

    renderBooks();

    function handlePurchase() {
      if (localStorage.getItem('cornerstone_owner') === 'true') {
        alert("Ou se Pwopriyetè a! Ou pa bezwen peye.");
        return;
      }

      const codeInput = document.getElementById('referral-input').value.trim();
      const responseDiv = document.getElementById('api-response');
      
      if (codeInput === "") {
        responseDiv.style.color = "#ff505d";
        responseDiv.textContent = "⚠️ Ou dwe gen yon kòd parrenaj nan lyen ou an.";
        return;
      }

      isUnlocked = true;
      responseDiv.style.color = "#97c373";
      responseDiv.textContent = "✔ Peman reyisi! 750 Gdes pou Pwopriyetè, 250 Gdes pou Parenn (" + codeInput + "). Liv yo debloke!";
      document.getElementById('access-status').textContent = "🔓 Tout Liv yo Debloke";
    }

    function getReferralCode() {
      let myCode = "CORNERSTONE-OWNER";
      if (localStorage.getItem('cornerstone_owner') !== 'true') {
        if (!isUnlocked) {
          alert("Ou dwe gen kont ou debloke an premye anvan ou ka jwenn lyen parrenaj pa w!");
          return;
        }
        myCode = "REF-" + Math.floor(10000 + Math.random() * 90000);
      }
      
      const currentUrl = window.location.origin + window.location.pathname;
      const myShareLink = currentUrl + "?ref=" + myCode;

      const responseDiv = document.getElementById('api-response');
      responseDiv.style.color = "#f5a94d";
      responseDiv.innerHTML = "Kòd Parrenaj ou a se: <b>" + myCode + "</b><br>Pataje lyen sa a ak zanmi w:<br><input type='text' value='" + myShareLink + "' readonly style='font-size:11px;' onclick='this.select()'>";
    }
  </script>
</body>
</html>
